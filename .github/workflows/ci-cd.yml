name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simula il deploy senza caricare file"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, iconv
          coverage: none

      - name: Sintassi di tutti i file PHP
        run: find . -name '*.php' -not -path './public/uploads/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Rotte collegate a controller esistenti
        run: php bin/check-routes.php

  smoke:
    name: Smoke test
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Valori fittizi: il DB non è raggiungibile, si verifica che il sito regga comunque
      APP_DEBUG: "false"
      DB_HOST: 127.0.0.1
      DB_USER: ci
      DB_PASS: ci
      DB_NAME: ci
      BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: none

      - name: Avvia il server integrato
        run: |
          php -S localhost:8000 public/index.php > server.log 2>&1 &
          sleep 2

      - name: Verifica risposte HTTP
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$1")
            if [ "$code" != "$2" ]; then echo "✖ $1 → $code (atteso $2)"; exit 1; fi
            echo "✔ $1 → $code"
          }
          check /                               200
          check /login                          200
          check /sitemap.xml                    200
          check /public/assets/js/homepage.js   200
          check /pagina-inesistente             404
          check /api/inesistente                404
          check /config/config.php              404
          check /.env                           404

      - name: Log del server
        if: failure()
        run: cat server.log

  secrets:
    name: Scansione segreti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy in produzione
    needs: [lint, smoke, secrets]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.giorgiodifusco.it
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Evita di caricare il sito nella cartella sbagliata: la destinazione deve già
      # contenere public/index.php. Se non lo contiene, elenca la radice FTP per aiutare
      # a scegliere il valore giusto di FTP_SERVER_DIR.
      - name: Verifica cartella di destinazione
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          case "$FTP_SERVER_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR deve terminare con '/' (valore attuale: '$FTP_SERVER_DIR')"; exit 1 ;;
          esac

          case "$FTP_PROTOCOL" in
            ftps)        scheme=ftp;  tls=(--ssl-reqd) ;;
            ftps-legacy) scheme=ftps; tls=() ;;
            ftp)         scheme=ftp;  tls=() ;;
            *) echo "::error::FTP_PROTOCOL non valido: $FTP_PROTOCOL"; exit 1 ;;
          esac

          # Credenziali in un file di config curl (non sulla riga di comando),
          # con escape di \ e " così funzionano password con spazi o simboli
          curlcfg=$(mktemp)
          esc() { printf '%s' "$1" | sed 's/[\\"]/\\&/g'; }
          printf 'user = "%s:%s"\n' "$(esc "$FTP_USERNAME")" "$(esc "$FTP_PASSWORD")" > "$curlcfg"

          # Nelle URL FTP il path è relativo alla cartella di login; %2F lo rende assoluto
          dir="${FTP_SERVER_DIR#./}"
          case "$dir" in /*) dir="%2F${dir#/}" ;; esac
          base="$scheme://$FTP_SERVER:$FTP_PORT"

          list() { curl -sS -K "$curlcfg" "${tls[@]}" --list-only "$1"; }
          trap 'rm -f "$curlcfg"' EXIT

          # 1) Connessione, TLS e login: problemi diversi da una cartella sbagliata
          if ! root_listing=$(list "$base/" 2>&1); then
            echo "::error::Connessione FTP fallita (server, certificato TLS o credenziali):"
            echo "$root_listing" | sed 's/^/  /'
            if grep -q 'SSL' <<< "$root_listing"; then
              echo "Il certificato del server non corrisponde a FTP_SERVER: usa come FTP_SERVER il nome"
              echo "riportato nel certificato (per Aruba è del tipo ftplnxNN.aruba.it)."
            fi
            exit 1
          fi

          # 2) La destinazione deve contenere il sito già installato
          if list "$base/${dir}public/" 2>/dev/null | grep -qx 'index.php'; then
            echo "✔ Destinazione valida: '${FTP_SERVER_DIR}' contiene public/index.php"
            exit 0
          fi

          echo "::error::'${FTP_SERVER_DIR}' non contiene public/index.php: deploy annullato per non caricare il sito nel posto sbagliato."
          echo "Contenuto della cartella di login FTP:"
          echo "$root_listing" | sed 's/^/  /'
          echo "Imposta la variabile FTP_SERVER_DIR (Settings → Environments → production) sulla cartella che contiene app/, core/ e public/, con '/' finale."
          exit 1

      # Sincronizza solo i file cambiati dall'ultimo deploy (stato in .ftp-deploy-sync-state.json
      # sul server, protetto dal .htaccess come ogni dotfile). Vengono cancellati solo file
      # caricati da un deploy precedente: .env e i file in public/uploads/ non sono nel repo,
      # quindi sul server restano intatti.
      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Verifica il certificato TLS (il default "loose" invierebbe la password a chiunque risponda)
          security: ${{ vars.FTP_PROTOCOL == 'ftp' && 'loose' || 'strict' }}
          dry-run: ${{ inputs.dry_run || false }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            .githooks/**
            .github/**
            .env
            .env.*
            README.md
            schemas/**
            bin/**
